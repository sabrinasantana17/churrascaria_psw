{% extends 'base.html' %}
{% block title %}Enviar feedback{% endblock %}
{% block content %}
    <h1 class="h3 mb-4 text-gray-800 page-title"><i class="fas fa-comment-dots"></i>Enviar feedback</h1>
    <p class="text-muted font-italic">Sua opinião ajuda a melhorar o sistema. Conte o que está bom e o que pode melhorar.</p>

    <div class="card shadow mb-4">
        <div class="card-body">
            <form method="post" class="django-form">
                {% csrf_token %}
                <div class="form-group">
                    <label>Usuário</label>
                    <input type="text" class="form-control" value="{{ user.get_full_name|default:user.username }}" readonly>
                </div>
                {{ form.as_p }}
                <button class="btn btn-primary" type="submit"><i class="fas fa-paper-plane mr-1"></i>Enviar feedback</button>
                <a class="btn btn-secondary" href="{% url 'feedback_list' %}">Cancelar</a>
            </form>
        </div>
    </div>
{% endblock %}
