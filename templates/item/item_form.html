{% extends 'base.html' %}
{% block title %}Novo item{% endblock %}
{% block content %}
    <h1 class="h3 mb-4 text-gray-800 page-title"><i class="fas fa-drumstick-bite"></i>Novo item</h1>

    <div class="card shadow mb-4">
        <div class="card-body">
            <form method="post" class="django-form">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn btn-primary" type="submit"><i class="fas fa-save mr-1"></i>Salvar</button>
                <a class="btn btn-secondary" href="{% url 'item_list' %}">Cancelar</a>
            </form>
        </div>
    </div>
{% endblock %}
