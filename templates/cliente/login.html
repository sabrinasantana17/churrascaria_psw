{% extends "base.html" %}
{% block title %}Entrar{% endblock %}

{% block navbar %}
<nav class="navbar-minimal"></nav>
{% endblock %}

{% block content %}
<div class="auth-box">
    <h1>Entrar</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Entrar</button>
    </form>
    <p class="switch-link">Não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se</a></p>
</div>
{% endblock %}
