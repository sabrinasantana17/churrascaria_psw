{% extends "base_auth.html" %}
{% block title %}Criar conta{% endblock %}

{% block content %}
<div class="text-center">
    <h1 class="h4 text-gray-900 mb-4">Criar conta de cliente</h1>
</div>
<form method="post" class="user django-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary btn-user btn-block">
        <i class="fas fa-user-plus mr-1"></i> Cadastrar
    </button>
</form>
<hr>
<p class="switch-link text-center">Já tem conta? <a href="{% url 'login' %}">Entrar</a></p>
{% endblock %}
