<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Churrascaria{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            background: #f4f4f4;
            color: #222;
        }
        nav {
            background: #7a1f1f;
            padding: 14px 24px;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin-right: 18px;
            font-weight: bold;
        }
        nav a:hover { text-decoration: underline; }
        .container {
            max-width: 960px;
            margin: 24px auto;
            background: #fff;
            padding: 24px;
            border-radius: 6px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.15);
        }
        h1 { margin-top: 0; color: #7a1f1f; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }
        th, td {
            text-align: left;
            padding: 8px 10px;
            border-bottom: 1px solid #ddd;
        }
        th { background: #f0e5e5; }
        .btn {
            display: inline-block;
            background: #7a1f1f;
            color: #fff;
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
        .btn:hover { background: #5e1717; }
        form p { margin: 10px 0; }
        input[type=text], input[type=number], input[type=email],
        input[type=password], textarea, select {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .messages { list-style: none; padding: 0; }
        .messages li {
            background: #dff0d8;
            color: #3c763d;
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .empty { color: #888; font-style: italic; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'item_list' %}">Itens</a>
        <a href="{% url 'cliente_list' %}">Clientes</a>
        <a href="{% url 'funcionario_list' %}">Funcionários</a>
        <a href="{% url 'pedido_list' %}">Pedidos</a>
        <a href="{% url 'itempedido_list' %}">Itens do Pedido</a>
    </nav>
    <div class="container">
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
